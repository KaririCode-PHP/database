name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# kcode installs the toolchain pinned in devkit.php and runs the root
# configs (ADR-016); kcode itself is pinned by version and SHA-256.
env:
  KCODE_VERSION: 1.2.1
  KCODE_SHA256: 1bc43b06798b4e7fc1df341cc505f316549f0dd5efb9c8d80031415b0cdf3e3b

jobs:
  check:
    runs-on: ubuntu-24.04
    # Servidores reais para tests/Integration/Server (sem as URLs a suite e
    # pulada). Imagens fixadas por digest, como as actions (Spec V4.3.3 §32).
    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_USER: kc
          POSTGRES_PASSWORD: kc-test
          POSTGRES_DB: kc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kc -d kc_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mariadb:
        image: mariadb:10.11@sha256:e5fe75b2b9de0eb9f6f9a4d9c97272fb3a7480e389ccd487a786bab2a12cc0d7
        env:
          MARIADB_USER: kc
          MARIADB_PASSWORD: kc-test
          MARIADB_DATABASE: kc_test
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      KARIRICODE_DATABASE_PGSQL_URL: pgsql://kc:kc-test@127.0.0.1:5432/kc_test # secret-scan:allow: throwaway service container
      KARIRICODE_DATABASE_MYSQL_URL: mysql://kc:kc-test@127.0.0.1:3306/kc_test # secret-scan:allow: throwaway service container
    steps:
      # Actions fixadas pelo SHA do commit, nao pela tag (Spec V4.3.3 §32).
      # Tags sao mutaveis: CVE-2025-30066 (tj-actions/changed-files).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: pcov
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install kcode ${{ env.KCODE_VERSION }}, checksum verified
        run: |
          curl -fsSLo kcode.phar "https://github.com/KaririCode-PHP/devkit/releases/download/v${KCODE_VERSION}/kcode.phar"
          echo "${KCODE_SHA256}  kcode.phar" | sha256sum -c -
          sudo install -m 0755 kcode.phar /usr/local/bin/kcode
      - run: kcode init
      - run: composer check
      - run: composer sbom
