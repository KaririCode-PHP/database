name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# kcode installs the toolchain pinned in devkit.php and runs the root
# configs (ADR-016); kcode itself is pinned by version and SHA-256.
env:
  KCODE_VERSION: 1.2.1
  KCODE_SHA256: 1bc43b06798b4e7fc1df341cc505f316549f0dd5efb9c8d80031415b0cdf3e3b

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Actions fixadas pelo SHA do commit, nao pela tag (Spec V4.3.3 §32).
      # Tags sao mutaveis: CVE-2025-30066 (tj-actions/changed-files).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: pcov
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install kcode ${{ env.KCODE_VERSION }}, checksum verified
        run: |
          curl -fsSLo kcode.phar "https://github.com/KaririCode-PHP/devkit/releases/download/v${KCODE_VERSION}/kcode.phar"
          echo "${KCODE_SHA256}  kcode.phar" | sha256sum -c -
          sudo install -m 0755 kcode.phar /usr/local/bin/kcode
      - run: kcode init
      - run: composer check
      - run: composer sbom
